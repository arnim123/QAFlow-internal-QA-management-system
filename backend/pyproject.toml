[project]
name = "qaflow"
version = "0.1.0"
description = "QAFlow API for Main Fast Trade Technologies"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14",
    "bcrypt>=4.2",
    "fastapi>=0.115",
    "httpx>=0.27",
    "jsonschema>=4.22",
    "pydantic-settings>=2.6",
    "pyjwt>=2.9",
    "pyodbc>=5.2",
    "pytest>=8.3",
    "ruff>=0.8",
    "sqlalchemy>=2.0",
    "uvicorn[standard]>=0.32",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint.isort]
known-first-party = ["app"]
known-third-party = ["alembic"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
